services:
  - type: web
    name: litian-website
    runtime: static
    buildCommand: null
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: LITIAN_INQUIRY_ENDPOINT
        value: https://litian-worker.dongdaltd.workers.dev/inquiry
      - key: LITIAN_AI_ENDPOINT
        value: https://litian-worker.dongdaltd.workers.dev/ai-service
