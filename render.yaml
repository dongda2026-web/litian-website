# Optional historical host; Alibaba Cloud remains the current delivery target.
# Keep the existing service handle to avoid creating a second service on sync.
# Template only: no Render service has been changed or verified by this release.
services:
  - type: web
    name: litian-website
    runtime: static
    autoDeployTrigger: 'off'
    buildCommand: npm ci && npm run preflight:aliyun
    staticPublishPath: ./dist/client
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: no-store
